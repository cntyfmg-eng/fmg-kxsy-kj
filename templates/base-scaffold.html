<!DOCTYPE html>

<title>第1课 感受身边的空气 · 模拟实验演示</title>
<style>
:root{
  --bg-deep:#0a231b;
  --bg-panel:#123528;
  --bg-panel-2:#0e2c21;
  --bg-inset:#0b2419;
  --line:#1e4a38;
  --accent:#3fae82;
  --accent-bright:#5fd0a0;
  --gold:#d9b45c;
  --text:#e9f4ee;
  --text-dim:#a8c6b8;
  --danger:#e8836c;
  --warn:#e8b04b;
  --radius:16px;
  --raise:8px 8px 18px rgba(0,0,0,.55), -6px -6px 14px rgba(120,200,160,.06), inset 1px 1px 1px rgba(255,255,255,.09);
  --raise-sm:5px 5px 10px rgba(0,0,0,.5), -3px -3px 8px rgba(120,200,160,.06), inset .5px .5px 1px rgba(255,255,255,.10);
  --inset-sh:inset 5px 5px 10px rgba(0,0,0,.5), inset -3px -3px 8px rgba(120,200,160,.05);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:"Microsoft YaHei","PingFang SC",sans-serif;
  background:
    radial-gradient(1200px 600px at 18% -10%, #17483a 0%, transparent 60%),
    radial-gradient(1000px 520px at 110% 110%, #143d2e 0%, transparent 55%),
    var(--bg-deep);
  background-attachment:fixed;
  color:var(--text);
  display:flex;flex-direction:column;
  overflow:hidden;
}
/* ---------- 顶栏 ---------- */
.topbar{
  flex:0 0 64px;margin:12px 14px 10px;padding:0 22px;
  background:linear-gradient(145deg,#174534,#0f3427);
  border-radius:var(--radius);box-shadow:var(--raise);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.lesson-meta{display:flex;align-items:baseline;gap:12px;min-width:0;flex-wrap:wrap;}
.tag{
  background:linear-gradient(145deg,#1d5640,#15432f);border:1px solid #2a6a50;
  color:var(--accent-bright);font-weight:bold;font-size:15px;padding:6px 14px;border-radius:999px;
  box-shadow:var(--raise-sm);white-space:nowrap;
}
.lesson-title{font-size:22px;font-weight:bold;color:#fff;text-shadow:2px 2px 4px rgba(0,0,0,.5);}
.brand-box{display:flex;flex-direction:column;align-items:flex-end;gap:3px;cursor:pointer;}
.brand{font-size:20px;font-weight:bold;color:var(--gold);letter-spacing:2px;white-space:nowrap;text-shadow:2px 2px 5px rgba(0,0,0,.55);transition:transform .12s,color .12s;}
.brand::before{content:"⚗";margin-right:8px;}
.brand:hover{transform:translateY(-2px);color:#ffe59e;}
.brand-by{font-size:11px;font-weight:400;color:var(--gold);opacity:.78;letter-spacing:1px;white-space:nowrap;text-shadow:1px 1px 2px rgba(0,0,0,.4);}
.qr-overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:1000;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
.qr-overlay.show{display:flex;}
.qr-box{background:linear-gradient(160deg,#f2fbf7,#e2f2ea);border:2px solid var(--accent);border-radius:18px;padding:28px 34px;box-shadow:0 18px 60px rgba(0,0,0,.65);text-align:center;max-width:90vw;max-height:90vh;position:relative;}
.qr-box img{width:min(320px,55vh);height:auto;border-radius:12px;display:block;margin:0 auto 16px;}
.qr-box p{color:#1e3a2f;font-size:17px;font-weight:600;line-height:1.7;}
.qr-box .qr-close{position:absolute;top:8px;right:14px;background:none;border:none;font-size:26px;color:#5f7a70;cursor:pointer;line-height:1;}
.qr-box .qr-close:hover{color:#c0392b;}
/* ---------- 布局 ---------- */
.layout{flex:1;min-height:0;display:grid;grid-template-columns:212px 1fr 312px;gap:14px;padding:0 14px 14px;}
.panel{
  background:linear-gradient(160deg,var(--bg-panel),var(--bg-panel-2));
  border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--raise);
  display:flex;flex-direction:column;min-height:0;overflow:hidden;
}
.panel-head{flex:0 0 auto;padding:12px 16px 8px;font-size:16px;font-weight:bold;color:var(--accent-bright);letter-spacing:1px;display:flex;align-items:center;gap:8px;}
.panel-head::before{content:"";width:6px;height:18px;border-radius:3px;background:linear-gradient(180deg,var(--accent-bright),var(--accent));box-shadow:1px 1px 3px rgba(0,0,0,.5);}
/* 左：环节 */
.section-list{flex:1;overflow-y:auto;padding:6px 12px 12px;display:flex;flex-direction:column;gap:9px;}
.sec-item{
  background:linear-gradient(145deg,#16432f,#113726);border:1px solid #235c45;border-radius:12px;
  box-shadow:var(--raise-sm);padding:10px 11px;cursor:pointer;font-size:14.5px;color:var(--text);
  display:flex;align-items:center;gap:8px;transition:transform .12s,color .12s;word-break:break-all;
}
.sec-item:hover{transform:translateY(-2px);color:#fff;}
.sec-item.active{background:linear-gradient(145deg,#1f6a4c,#175138);border-color:var(--accent);color:#fff;box-shadow:6px 6px 14px rgba(0,0,0,.55), inset 2px 2px 4px rgba(255,255,255,.12);}
.sec-item .idx{
  flex:0 0 23px;height:23px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#2c7c58,#17492f);border:1px solid #2f7a58;
  color:var(--accent-bright);font-size:12px;font-weight:bold;display:flex;align-items:center;justify-content:center;
  box-shadow:inset 1px 1px 2px rgba(255,255,255,.15),2px 2px 4px rgba(0,0,0,.4);
}
.sec-item .del-btn{display:none;margin-left:auto;background:none;border:none;color:var(--danger);font-size:14px;cursor:pointer;}
.edit-mode .sec-item .del-btn{display:block;}
.add-sec{margin:0 12px 12px;padding:9px;border-radius:12px;border:1.5px dashed #3c8a67;background:rgba(63,174,130,.08);color:var(--accent-bright);font-size:14px;cursor:pointer;display:none;}
.edit-mode .add-sec{display:block;}
/* 中：演示 */
.center{display:flex;flex-direction:column;gap:12px;min-height:0;min-width:0;}
.equip-bar{
  flex:0 0 auto;background:linear-gradient(145deg,#153f2f,#103226);border:1px solid var(--line);
  border-radius:14px;box-shadow:var(--raise);padding:10px 16px;display:flex;align-items:flex-start;gap:12px;
}
.equip-bar .lab{
  flex:0 0 auto;font-size:14px;font-weight:bold;color:var(--gold);padding:3px 12px;border-radius:999px;
  background:linear-gradient(145deg,#1c5138,#14402c);border:1px solid #2f7a58;box-shadow:var(--raise-sm);white-space:nowrap;
}
.equip-text{font-size:15px;line-height:1.7;color:var(--text);flex:1;outline:none;}
.demo-wrap{flex:1;min-height:0;background:linear-gradient(160deg,var(--bg-panel),var(--bg-panel-2));border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--raise);display:flex;flex-direction:column;overflow:hidden;}
.demo-head{flex:0 0 auto;padding:9px 16px 5px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.demo-title{font-size:17px;font-weight:bold;color:var(--accent-bright);}
.stage-3d{
  flex:1;min-height:0;perspective:1100px;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 38%, rgba(63,174,130,.13) 0%, transparent 62%),var(--bg-inset);
  border-top:1px solid var(--line);overflow:hidden;position:relative;cursor:grab;
}
.stage-3d:active{cursor:grabbing;}
.stage-hint{position:absolute;bottom:7px;right:12px;font-size:11.5px;color:var(--text-dim);opacity:.75;pointer-events:none;background:rgba(10,35,27,.6);padding:3px 10px;border-radius:999px;}
.stage-card{max-width:96%;max-height:92%;transform-style:preserve-3d;transition:transform .18s ease-out;display:flex;flex-direction:column;align-items:center;gap:8px;will-change:transform;}
.scene{
  width:min(760px,72vh);height:auto;max-height:56vh;
  background:linear-gradient(180deg,#f2fbf7 0%,#dff0e7 60%,#cfe6da 100%);
  border-radius:14px;border:2px solid #2c6f53;
  box-shadow:10px 10px 26px rgba(0,0,0,.55), inset 0 0 20px rgba(63,174,130,.10);
}
/* 单件器材的 3D 观察（视角只作用于每件器材本身） */
.obj3d{transform-box:fill-box;transform-origin:50% 50%;will-change:transform;}
#p-squish,#s-bag{transform-box:fill-box;transform-origin:50% 50%;}
/* 器材高亮聚光 */
svg.spotlight > *:not(.spot-on){opacity:.13 !important;transition:opacity .3s ease;}
svg.spotlight .spot-on{opacity:1 !important;}
.spot-ring{fill:none;stroke:#ffd24a;stroke-width:3.5;stroke-dasharray:12 7;pointer-events:none;animation:spotdash .9s linear infinite;}
.spot-ring2{fill:none;stroke:#ffd24a;stroke-width:1.2;opacity:.55;pointer-events:none;}
.spot-tag{fill:#ffd24a;font-size:14px;font-weight:bold;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.6);}
@keyframes spotdash{to{stroke-dashoffset:-38}}
.hl-html{outline:3px dashed #ffd24a;outline-offset:4px;border-radius:10px;box-shadow:0 0 20px rgba(255,210,74,.5);}
/* 仪表 / 记录表 / 看板 */
.gauge{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text-dim);}
.gauge .gbar{flex:1;min-width:120px;height:11px;border-radius:999px;background:var(--bg-inset);box-shadow:var(--inset-sh);overflow:hidden;}
.gauge .gbar i{display:block;height:100%;width:50%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent-bright));transition:width .35s ease,background .35s ease;}
.gauge b{color:var(--text);font-variant-numeric:tabular-nums;min-width:44px;text-align:right;}
.rec{width:min(760px,72vh);border-collapse:separate;border-spacing:0;background:#fff;border-radius:10px;overflow:hidden;font-size:13.5px;box-shadow:0 4px 12px rgba(0,0,0,.35);}
.rec th{background:linear-gradient(135deg,#1f6a4c,#175138);color:#fff;padding:8px 6px;border:1px solid #2f7a58;}
.rec td{padding:7px 6px;text-align:center;border:1px solid #cfe0d6;color:#1e3a2f;}
.rec td:first-child{background:#eef7f1;font-weight:600;}
.rec .big{font-size:18px;font-weight:800;color:#c0392b;font-family:Consolas,monospace;}
.board{
  width:min(760px,72vh);max-height:56vh;overflow:auto;
  background:linear-gradient(180deg,#f2fbf7,#e2f2ea);color:#1e3a2f;
  border-radius:14px;border:2px solid #2c6f53;padding:18px 22px;
  box-shadow:10px 10px 26px rgba(0,0,0,.5);line-height:1.9;font-size:15px;
}
.board h4{color:#14614a;font-size:17px;margin:0 0 8px;border-bottom:2px dashed #8fc4ac;display:inline-block;padding-bottom:4px;}
.board p{margin:6px 0;}
.board ul{margin:6px 0 6px 22px;}
.board .q{background:#fff8e6;border-left:5px solid #e8a33d;padding:10px 14px;border-radius:8px;margin:10px 0;}
.board .con{background:#e9f7ef;border-left:5px solid #2e9e6b;padding:10px 14px;border-radius:8px;margin:10px 0;}
.board table{width:100%;border-collapse:collapse;margin:8px 0;font-size:14px;}
.board th,td{border:1px solid #b9d9c9;padding:7px 8px;text-align:center;}
.board th{background:#d9efe4;color:#14614a;}
.board .mini-svg{width:100%;max-width:520px;height:auto;display:block;margin:8px auto;}
/* 步骤条 */
.steps-bar{
  flex:0 0 auto;background:linear-gradient(145deg,#153f2f,#103226);border:1px solid var(--line);
  border-radius:14px;box-shadow:var(--raise);padding:9px 14px;display:flex;flex-direction:column;gap:7px;
}
.steps-label{font-size:14px;font-weight:bold;color:var(--gold);display:flex;align-items:center;gap:8px;}
.steps-text{font-size:14.5px;line-height:1.75;color:var(--text);min-height:44px;}
.progress{height:7px;border-radius:999px;background:var(--bg-inset);box-shadow:var(--inset-sh);overflow:hidden;}
.progress i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent-bright));transition:width .3s ease;}
.ctrl-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.cbtn{
  background:linear-gradient(145deg,#1d5640,#15432f);border:1px solid #2f7a58;color:var(--text);
  font-size:13px;padding:7px 14px;border-radius:10px;cursor:pointer;box-shadow:var(--raise-sm);white-space:nowrap;
}
.cbtn:hover{color:#fff;border-color:var(--accent-bright);}
.cbtn:active{box-shadow:var(--inset-sh);transform:translateY(1px);}
.cbtn.hi{background:linear-gradient(145deg,#8a6d2b,#6d5420);border-color:#b1934a;color:#fff;}
.cbtn.act{background:linear-gradient(145deg,#b1531f,#8a3f16);border-color:#d07a45;color:#fff;}
.step-count{margin-left:auto;font-size:12.5px;color:var(--text-dim);font-variant-numeric:tabular-nums;}
/* 右：选项 + 分析 */
.right{display:flex;flex-direction:column;gap:12px;min-height:0;}
.opt-box{flex:0 0 auto;min-height:0;}
.ana-box{flex:1;min-height:0;}
.panel-body{flex:1;min-height:0;overflow-y:auto;padding:4px 14px 14px;display:flex;flex-direction:column;gap:9px;}
.opt-group-title{font-size:13.5px;font-weight:bold;color:var(--gold);display:flex;align-items:center;gap:8px;margin-top:3px;}
.opt-group-title .add-chip{display:none;margin-left:auto;background:none;border:1px dashed #3c8a67;color:var(--accent-bright);border-radius:8px;font-size:12px;padding:2px 8px;cursor:pointer;}
.edit-mode .opt-group-title .add-chip{display:inline-block;}
.chips{display:flex;flex-wrap:wrap;gap:7px;}
.chip{
  background:linear-gradient(145deg,#16432f,#113726);border:1px solid #235c45;border-radius:999px;
  color:var(--text);font-size:13px;padding:6px 12px;cursor:pointer;box-shadow:var(--raise-sm);
  display:flex;align-items:center;gap:6px;word-break:break-all;
}
.chip:hover{color:#fff;}
.chip.on{background:linear-gradient(145deg,#1f6a4c,#175138);border-color:var(--accent-bright);color:#fff;box-shadow:6px 6px 12px rgba(0,0,0,.55), inset 1px 1px 3px rgba(255,255,255,.15);}
.chip .chip-del{display:none;color:var(--danger);font-size:12px;}
.edit-mode .chip .chip-del{display:inline;}
.view-ctrl{background:var(--bg-inset);border-radius:12px;box-shadow:var(--inset-sh);padding:11px;display:flex;flex-direction:column;gap:9px;}
.view-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;}
.vbtn{background:linear-gradient(145deg,#1d5640,#15432f);border:1px solid #2f7a58;border-radius:10px;color:var(--text);font-size:12.5px;padding:7px 4px;cursor:pointer;box-shadow:var(--raise-sm);}
.vbtn:active{box-shadow:var(--inset-sh);transform:translateY(1px);}
.view-reset{grid-column:1 / -1;background:linear-gradient(145deg,#8a6d2b,#6d5420);border-color:#b1934a;color:#fff;}
.auto-note{font-size:11.5px;color:var(--text-dim);text-align:center;}
.ana-block{display:flex;flex-direction:column;gap:4px;}
.ana-label{font-size:13.5px;font-weight:bold;color:var(--accent-bright);}
.ana-text{font-size:14px;line-height:1.8;color:var(--text);outline:none;white-space:pre-wrap;}
.ana-text a{color:var(--gold);}
.divider{height:1px;background:linear-gradient(90deg,transparent,#2a6a50,transparent);}
/* 工具条 */
.toolbar{
  flex:0 0 auto;margin:0 14px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:linear-gradient(145deg,#123528,#0e2c21);border:1px solid var(--line);border-radius:14px;box-shadow:var(--raise);padding:8px 14px;
}
.tb-btn{background:linear-gradient(145deg,#1d5640,#15432f);border:1px solid #2f7a58;color:var(--text);font-size:13.5px;padding:8px 15px;border-radius:10px;cursor:pointer;box-shadow:var(--raise-sm);display:flex;align-items:center;gap:6px;white-space:nowrap;}
.tb-btn:hover{color:#fff;border-color:var(--accent-bright);}
.tb-btn:active{box-shadow:var(--inset-sh);transform:translateY(1px);}
.tb-btn.gold{background:linear-gradient(145deg,#8a6d2b,#6d5420);border-color:#b1934a;color:#fff;}
.tb-btn.on{background:linear-gradient(145deg,#b1531f,#8a3f16);border-color:#d07a45;color:#fff;}
.tb-tip{margin-left:auto;font-size:12.5px;color:var(--text-dim);}
input[type=file]{display:none;}
[contenteditable]:focus{outline:2px dashed rgba(95,208,160,.45);outline-offset:3px;border-radius:6px;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#245c45;border-radius:99px;}
@media (max-width:1180px){
  body{overflow:auto;}
  .layout{grid-template-columns:1fr;grid-auto-rows:auto;}
  .panel{min-height:200px;}
  .demo-wrap{min-height:460px;}
  .scene,.rec,.board{width:100%;max-width:none;}
}
</style>

<script>
"use strict";
/* ==================== 通用工具 ==================== */
const $ = id => document.getElementById(id);
const STORE_KEY = "fmg-kxsy-lesson-v1"; // 每个课件改成唯一值（如 "fmg-kxsy-<课名>"）避免 localStorage 串数据
function esc(s){ const d=document.createElement("div"); d.textContent = (s==null?"":String(s)); return d.innerHTML; }
function tween(dur, cb){
  return new Promise(res=>{
    const t0 = performance.now();
    (function f(now){
      const p = Math.min(1,(now-t0)/dur);
      cb(p);
      if(p<1) requestAnimationFrame(f); else res();
    })(t0);
  });
}
function fade(id, to, dur){
  const e = typeof id==="string" ? $(id) : id;
  if(!e) return Promise.resolve();
  e.style.transition = "opacity "+(dur||380)/1000+"s ease";
  e.style.opacity = to;
  return new Promise(r=>setTimeout(r, dur||380));
}
function setA(id, attr, v){ const e=$(id); if(e) e.setAttribute(attr, v); }
function wait(ms){ return new Promise(r=>setTimeout(r, ms)); }
function gVal(id, v){ const e=$(id); if(e) e.textContent = v; }

  setTilt(a){

    }
  },

/* ===== 器材高亮（聚光灯） ===== */
let curSpot = null;
function clearSpot(){
  const svg=document.querySelector("#stageCard svg");
  if(svg){
    svg.classList.remove("spotlight");
    svg.querySelectorAll(".spot-on").forEach(e=>e.classList.remove("spot-on"));
    svg.querySelectorAll(".spot-ring,.spot-ring2,.spot-tag").forEach(e=>e.remove());
  }
  document.querySelectorAll("#stageCard .hl-html").forEach(e=>e.classList.remove("hl-html"));
  curSpot=null;
}
function drawRing(svg, ids, label){
  const vb = svg.viewBox && svg.viewBox.baseVal;
  if(!vb || !vb.width) return;
  const sr = svg.getBoundingClientRect();
  if(!sr.width || !sr.height) return;
  const sc = Math.min(sr.width/vb.width, sr.height/vb.height);
  const ox = (sr.width - vb.width*sc)/2, oy = (sr.height - vb.height*sc)/2;
  let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9, hit=false;
  ids.forEach(id=>{
    const el=$(id); if(!el || !el.getBoundingClientRect) return;
    const r=el.getBoundingClientRect();
    if(!r.width && !r.height) return;
    hit=true;
    const ax=(r.left-sr.left-ox)/sc, ay=(r.top-sr.top-oy)/sc;
    const bx=(r.right-sr.left-ox)/sc, by=(r.bottom-sr.top-oy)/sc;
    x1=Math.min(x1,ax); y1=Math.min(y1,ay); x2=Math.max(x2,bx); y2=Math.max(y2,by);
  });
  if(!hit) return;
  const pad=12, NS="http://www.w3.org/2000/svg";
  const r1=document.createElementNS(NS,"rect");
  r1.setAttribute("x",x1-pad); r1.setAttribute("y",y1-pad);
  r1.setAttribute("width",(x2-x1)+pad*2); r1.setAttribute("height",(y2-y1)+pad*2);
  r1.setAttribute("rx",10); r1.setAttribute("class","spot-ring spot-on");
  svg.appendChild(r1);
  const r2=r1.cloneNode(false);
  r2.setAttribute("class","spot-ring2 spot-on");
  svg.appendChild(r2);
  if(label){
    const t=document.createElementNS(NS,"text");
    t.setAttribute("x",x1-pad); t.setAttribute("y",Math.max(16,y1-pad-9));
    t.setAttribute("class","spot-tag spot-on");
    t.textContent="★ "+label;
    svg.appendChild(t);
  }
}
function spotlight(label, ids){
  clearSpot();
  if(!ids || !ids.length) return false;
  const svg=document.querySelector("#stageCard svg");
  let ok=false;
  if(svg){
    ids.forEach(id=>{
      const el=$(id); if(!el) return;
      ok=true;
      if(el.namespaceURI==="http://www.w3.org/2000/svg"){
        let n=el;
        while(n){ n.classList.add("spot-on"); if(n===svg) break; n=n.parentNode; }
      }else{
        el.classList.add("hl-html");
      }
    });
    if(ok){ svg.classList.add("spotlight"); drawRing(svg, ids, label); }
  }else{
    ids.forEach(id=>{ const el=$(id); if(el){ ok=true; el.classList.add("hl-html"); } });
  }
  if(!ok) return false;
  curSpot={label:label, ids:ids};
  return true;
}
function refreshSpot(){ if(curSpot) { const c=curSpot; curSpot=null; spotlight(c.label, c.ids); } }

/* ==================== 渲染 ==================== */
let editMode=false, rotX=0, rotY=0, zoom=1;
let curStep = 0, playing = false, stepList = [], moduleState = null, curPlan = null;

function renderAll(){ renderHeader(); renderList(); renderCenter(); renderRight(); }
function renderHeader(){
  $("metaUnit").textContent = LESSON.meta.unit;
  $("metaLesson").textContent = LESSON.meta.lesson;
  $("metaTitle").textContent = LESSON.meta.title;
}
function renderList(){
  const box=$("sectionList"); box.innerHTML="";
  LESSON.sections.forEach((s,i)=>{
    const d=document.createElement("div");
    d.className="sec-item"+(s.id===LESSON.activeId?" active":"");
    d.innerHTML='<span class="idx">'+(i+1)+'</span><span class="nm">'+esc(s.title)+'</span><button class="del-btn" title="删除">✕</button>';
    d.querySelector(".nm").addEventListener("click",()=>{ LESSON.activeId=s.id; saveLesson(true); renderAll(); });
    d.querySelector(".del-btn").addEventListener("click",e=>{
      e.stopPropagation();
      if(LESSON.sections.length<=1){ tip("⚠️ 至少保留一个环节"); return; }
      if(!confirm("确定删除环节「"+s.title+"」？")) return;
      LESSON.sections = LESSON.sections.filter(x=>x.id!==s.id);
      if(LESSON.activeId===s.id) LESSON.activeId = LESSON.sections[0].id;
      saveLesson(true); renderAll();
    });
    box.appendChild(d);
  });
}
function renderCenter(){
  const s = sec();
  const M = MODULES[s.module] || boardMod;
  $("demoTitle").textContent = s.title + " · 演示";
  $("equipText").textContent = s.equip || "";
  const card = $("stageCard");
  clearSpot();
  card.innerHTML = M.scene(s);
  resetView(false);
  if(M.init) M.init();
  curPlan = (s.plans && s.plans[0]) ? s.plans[0].id : null;
  if(M.setPlan && curPlan) M.setPlan(curPlan, ctxApi());
  stepList = (typeof M.steps==="function" ? M.steps(s) : M.steps) || [];
  renderModBtns(M);
  curStep = 0;
  playing = false;
  $("btnAuto").textContent = "▶ 自动演示";
  $("btnAuto").classList.remove("act");
  paintStep();
}
function ctxApi(){ return { rebuild: rebuildSteps }; }
function rebuildSteps(){
  const s=sec(); const M=MODULES[s.module]||boardMod;
  stepList = (typeof M.steps==="function" ? M.steps(s) : M.steps) || [];
  curStep = 0; playing = false;
  $("btnAuto").textContent="▶ 自动演示"; $("btnAuto").classList.remove("act");
  paintStep();
}
function renderModBtns(M){
  const box=$("modBtns"); box.innerHTML="";
  if(!M.controls) return;
  (M.controls()||[]).forEach(c=>{
    const b=document.createElement("button");
    b.className="cbtn"; b.style.fontSize="12.5px"; b.style.padding="5px 10px"; b.textContent=c.label;
    if(c.click) b.addEventListener("click",c.click);
    if(c.hold){
      b.addEventListener("pointerdown",e=>{ e.preventDefault(); c.hold.down(); });
      b.addEventListener("pointerup",()=>c.hold.up());
      b.addEventListener("pointerleave",()=>c.hold.up());
    }
    box.appendChild(b);
  });
}
async function paintStep(){
  const s=sec(); const M=MODULES[s.module]||boardMod;
  const total=stepList.length;
  const st=stepList[curStep];
  $("stepsText").textContent = st ? st.t : "（本环节暂无步骤）";
  $("stepCount").textContent = (total?curStep+1:0)+" / "+total;
  if($("stepProgress")) $("stepProgress").style.width = total ? ((curStep+1)/total*100)+"%" : "0";
  $("stageTip").textContent = st ? ("步骤 "+(curStep+1)+" / "+total) : "准备就绪";
  if(st && typeof st.act==="function"){ try{ await st.act(); }catch(e){} }
  if(curSpot) refreshSpot();
}
async function runFrom(i){
  const s=sec(); const M=MODULES[s.module]||boardMod;
  M.reset && M.reset();
  await wait(120);
  curStep=0; await paintStep();
  while(curStep<i){ curStep++; await paintStep(); }
}
async function autoPlay(){
  if(playing){ playing=false; $("btnAuto").textContent="▶ 继续演示"; $("btnAuto").classList.remove("act"); return; }
  playing=true; $("btnAuto").textContent="⏸ 暂停"; $("btnAuto").classList.add("act");
  while(playing && curStep < stepList.length){
    await paintStep();
    const st=stepList[curStep];
    const t0=Date.now();
    while(playing && Date.now()-t0 < (st.ms||2000)) await wait(60);
    if(!playing) break;
    if(curStep>=stepList.length-1){ playing=false; $("btnAuto").textContent="▶ 重新演示"; $("btnAuto").classList.remove("act"); break; }
    curStep++;
  }
}
$("btnPrev").addEventListener("click",()=>{ playing=false; $("btnAuto").textContent="▶ 自动演示"; $("btnAuto").classList.remove("act"); if(curStep>0){ curStep--; paintStep(); } });
$("btnNext").addEventListener("click",()=>{ playing=false; $("btnAuto").textContent="▶ 自动演示"; $("btnAuto").classList.remove("act"); if(curStep<stepList.length-1){ curStep++; paintStep(); } });
$("btnAuto").addEventListener("click",()=>{ if(curStep>=stepList.length-1){ curStep=0; } autoPlay(); });
$("btnResetExp").addEventListener("click",async()=>{
  playing=false; $("btnAuto").textContent="▶ 自动演示"; $("btnAuto").classList.remove("act");
  const s=sec(); const M=MODULES[s.module]||boardMod;
  if(M.reset) await M.reset();
  curStep=0; await paintStep(); if(curSpot) refreshSpot(); tip("↻ 已重置到初始状态");
});
$("stepsText").addEventListener("dblclick",()=>{ if(!editMode) { autoPlay(); } });

function renderRight(){
  const s=sec();
  s.equipOpts=s.equipOpts||[]; s.plans=s.plans||[];
  renderChips($("equipChips"), s.equipOpts, i=>{ s.equipOpts.splice(i,1); saveLesson(true); renderRight(); }, true, (label,i,on)=>{
    if(curSpot && curSpot.label===label){
      clearSpot();
      [...$("equipChips").querySelectorAll(".chip")].forEach(x=>x.classList.remove("on"));
      tip("已取消高亮"); return;
    }
    const ids = (EQUIP_TARGETS[s.id]||{})[label];
    if(!ids){ clearSpot(); tip("「"+label+"」在演示图中没有对应位置（可在编辑模式下改名/添加）"); return; }
    if(spotlight(label, ids)) tip("🖼 已高亮「"+label+"」· 可用 3D 视角全方位观察它");
  }, -1);
  renderChips($("planChips"), s.plans.map(p=>p.label), i=>{ s.plans.splice(i,1); saveLesson(true); renderRight(); }, true, (label,i)=>{
    curPlan = (s.plans[i] && s.plans[i].id) || null;
    const M = MODULES[s.module]||boardMod;
    if(M.setPlan) M.setPlan(curPlan, ctxApi());
    stepList = (typeof M.steps==="function" ? M.steps(s) : M.steps) || [];
    curStep = 0; playing = false; $("btnAuto").textContent="▶ 自动演示"; $("btnAuto").classList.remove("act");
    paintStep();
  });
  $("anaAnalysis").textContent = s.analysis||"";
  $("anaPrinciple").textContent = s.principle||"";
  $("anaExamples").textContent = s.examples||"";
}
function renderChips(box, arr, onDel, single, onUse, defOn){
  box.innerHTML="";
  const di = (typeof defOn==="number") ? defOn : (single ? 0 : -1);
  if(!arr.length){ box.innerHTML='<span style="font-size:12.5px;color:var(--text-dim)">（暂无，编辑模式下点 ＋ 添加）</span>'; return; }
  arr.forEach((t,i)=>{
    const c=document.createElement("span");
    c.className="chip"+(i===di ? " on":"");
    c.innerHTML=esc(t)+'<button class="chip-del" title="删除">✕</button>';
    c.addEventListener("click",e=>{
      if(e.target.classList.contains("chip-del")) return;
      let on;
      if(single){
        [...box.querySelectorAll(".chip")].forEach(x=>x.classList.remove("on"));
        c.classList.add("on"); on=true;
      }else{
        on=c.classList.toggle("on");
      }
      if(onUse) onUse(t, i, on);
    });
    c.querySelector(".chip-del").addEventListener("click",e=>{ e.stopPropagation(); onDel(i); });
    box.appendChild(c);
  });
}

/* ==================== 3D 视角 ==================== */
/* 视角只作用于「每件器材」本身，实验台（桌面）保持不动 */
function applyView(anim){
  const objs=document.querySelectorAll("#stageCard .obj3d");
  const t="perspective(950px) rotateX("+rotX+"deg) rotateY("+rotY+"deg) scale("+zoom+")";
  const card=$("stageCard");
  if(objs.length){
    objs.forEach(el=>{ el.style.transition = anim===false ? "none" : "transform .25s ease-out"; el.style.transform=t; });
    card.style.transition="none"; card.style.transform="none";
  }else{
    card.style.transition = anim===false ? "none" : "transform .18s ease-out";
    card.style.transform = "scale("+zoom+") rotateX("+rotX+"deg) rotateY("+rotY+"deg)";
  }
  if(curSpot) refreshSpot();
}
function resetView(anim){ rotX=0; rotY=0; zoom=1; applyView(anim); }
function clampView(){ rotX=Math.max(-60,Math.min(60,rotX)); rotY=Math.max(-70,Math.min(70,rotY)); }
function enableDragRotate(){
  const stage=$("stage3d");
  if(stage._drag) return; stage._drag=true;
  let down=false, lx=0, ly=0;
  stage.addEventListener("pointerdown",e=>{ if(e.target.closest("a,button")) return; down=true; lx=e.clientX; ly=e.clientY; try{stage.setPointerCapture(e.pointerId);}catch(err){} });
  stage.addEventListener("pointermove",e=>{
    if(!down) return;
    rotY += (e.clientX-lx)*0.4; rotX -= (e.clientY-ly)*0.4;
    clampView(); lx=e.clientX; ly=e.clientY; applyView(false);
  });
  stage.addEventListener("pointerup",()=>{ down=false; });
}
/* 3D 视角控制面板已移除，保留变量占位避免旧数据报错 */
if(false){ applyView(); resetView(); clampView(); }

/* ==================== 编辑 / 保存 / 导入导出 ==================== */
function bindEditable(el, setter){
  if(!el) return;
  el.addEventListener("blur",()=>setter(el.innerText.trim()));
}
bindEditable($("metaUnit"), v=>{ LESSON.meta.unit=v; saveLesson(true); });
bindEditable($("metaLesson"), v=>{ LESSON.meta.lesson=v; saveLesson(true); });
bindEditable($("metaTitle"), v=>{ LESSON.meta.title=v; saveLesson(true); });
bindEditable($("equipText"), v=>{ sec().equip=v; saveLesson(true); });
bindEditable($("anaAnalysis"), v=>{ sec().analysis=v; saveLesson(true); });
bindEditable($("anaPrinciple"), v=>{ sec().principle=v; saveLesson(true); });
bindEditable($("anaExamples"), v=>{ sec().examples=v; saveLesson(true); });

function setEditMode(on){
  editMode=on; document.body.classList.toggle("edit-mode", on);
  const b=$("editToggle");
  b.textContent = on ? "🔒 编辑模式：开" : "✏️ 编辑模式：关";
  b.classList.toggle("on", on);
  const list=[$("metaUnit"),$("metaLesson"),$("metaTitle"),$("equipText"),$("anaAnalysis"),$("anaPrinciple"),$("anaExamples")];
  list.forEach(el=>el.setAttribute("contenteditable", on ? "true":"false"));
  tip(on ? "✏️ 编辑模式：可直接修改文字；器材/方案右侧 ＋ 可添加选项；左侧可增删环节" : "🔒 已退出编辑模式");
}
$("editToggle").addEventListener("click",()=>setEditMode(!editMode));
$("saveBtn").addEventListener("click",()=>saveLesson(false));
$("addSectionBtn").addEventListener("click",()=>{
  const t=prompt("新环节名称：","任务六");
  if(!t) return;
  const id="s"+Date.now().toString(36);
  LESSON.sections.push({id:id,title:t,module:"board",equip:"",equipOpts:[],plans:[],analysis:"",principle:"",examples:"",board:'<h4>'+esc(t)+'</h4><p>在这里填写本环节内容（编辑模式下可直接在页面文字区修改）。</p>'});
  LESSON.activeId=id; saveLesson(true); renderAll();
});
document.querySelectorAll(".add-chip").forEach(btn=>{
  btn.addEventListener("click",()=>{
    const s=sec(); const key=btn.dataset.addChip;
    const t=prompt(key==="equip" ? "新器材名称：" : "新实验方案名称：");
    if(!t) return;
    if(key==="equip") (s.equipOpts=s.equipOpts||[]).push(t);
    else (s.plans=s.plans||[]).push({id:"p"+Date.now().toString(36), label:t});
    saveLesson(true); renderRight();
  });
});
$("exportBtn").addEventListener("click",()=>{
  const blob=new Blob([JSON.stringify(LESSON,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=(LESSON.meta.title||"课件")+"-数据.json"; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  tip("📤 已导出 JSON 数据文件");
});
$("importBtn").addEventListener("click",()=>$("jsonInput").click());
$("jsonInput").addEventListener("change",function(){
  const f=this.files && this.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d.sections||!d.sections.length) throw new Error("数据格式不正确");
      LESSON=d; saveLesson(true); renderAll(); tip("📥 导入成功");
    }catch(e){ alert("导入失败："+e.message); }
  };
  r.readAsText(f); this.value="";
});
$("resetBtn").addEventListener("click",()=>{
  if(!confirm("将清空所有修改、恢复默认课件数据，确定？")) return;
  localStorage.removeItem(STORE_KEY);
  LESSON=defaultLesson(); saveLesson(true); renderAll(); tip("♻️ 已恢复默认数据");
});

/* ==================== 二维码弹窗 ==================== */
$("brandBtn").addEventListener("click",()=>{ $("qrOverlay").classList.add("show"); });
$("qrOverlay").addEventListener("click",()=>{ $("qrOverlay").classList.remove("show"); });
$("qrClose").addEventListener("click",()=>{ $("qrOverlay").classList.remove("show"); });

/* ==================== 启动 ==================== */
renderAll();
window.addEventListener("beforeunload",()=>{ try{ localStorage.setItem(STORE_KEY, JSON.stringify(LESSON)); }catch(e){} });
</script>
